[project]
name = "odmpy"
version = "0.8.1"
description = "A console downloader for an OverDrive audiobook loan."
readme = "README.md"
authors = [
    { name = "ping" }
]
requires-python = ">=3.7"
dependencies = [
    "requests>=2.28.0",
    "eyed3>=0.9.7",
    "mutagen>=1.46.0",
    "termcolor>=2.0.0",
    "tqdm>=4.63.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "iso639-lang>=2.1.0",
    "typing_extensions; python_version < '3.8'",
]

[project.scripts]
odmpy = "odmpy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odmpy"]

[dependency-groups]
dev = [
    "ruff",
    "pylint",
    "black",
    "mypy",
    "types-requests",
    "types-tqdm",
    "types-beautifulsoup4",
    "responses",
    "lxml",
    "EbookLib",
    "coverage",
]
